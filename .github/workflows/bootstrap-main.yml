# One-off bootstrap: creates the `main` branch at a given commit SHA.
# Needed because this repo was initialized from a feature branch and the
# session's git access is scoped to that branch only. Safe to delete after use.
name: Bootstrap main branch

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA that main should point at"
        required: true

permissions:
  contents: write

jobs:
  create-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create main at the given SHA
        run: git push origin "${{ inputs.sha }}:refs/heads/main"
